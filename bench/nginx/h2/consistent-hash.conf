# Nginx comparison config: TLS + HTTP/2 with consistent hashing (S5.T5.2).
#
# Nearest-equivalent competitor, not a match: `hash $remote_addr consistent` is
# ketama consistent hashing on the same hash key the LB uses (`$remote_addr`),
# but it has NO bounded loads — nginx pins every request for a hot key to one
# backend, while the LB's `ConsistentHashBoundedLoads` spills the excess to the
# next backend on the ring once in-flight load exceeds the capacity bound.
#
# `http2 on;` is the nginx 1.25.1+ syntax; the certificate is the shared SAN
# cert from scripts/generate-cert.sh, mounted at /certs, and the backends are
# reached over TLS (the h2 slice runs them with TLS). Apart from the upstream
# algorithm it is identical to h2/roundrobin.conf.

# Fixed at 2 = the competitors' cpuset size (cores 0-1); `auto` counts online CPUs and ignores the cpuset, so do not parameterise this.
worker_processes 2;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream backends {
        hash $remote_addr consistent;
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
        server backend4:8080;

        # Matches the LB's transport.max_idle_conns_per_host (spec §24).
        keepalive 100;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            proxy_pass https://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }
    }
}
