# Nginx comparison config: TLS + HTTP/2 (ALPN) (S5.T4-infra).
#
# Same constrained match as http11.conf — round-robin, four backends, keepalive
# 100 — so the HTTP/1.1-vs-HTTP/2 protocol slice compares protocol, not tuning.
#
# `http2 on;` is the nginx 1.25.1+ syntax; the deprecated `listen ... http2;`
# form is deliberately not used (spec §26). The certificate is the shared SAN
# cert from scripts/generate-cert.sh, mounted at /certs.
#
# Run by the `nginx` service in bench/docker-compose.yml (pinned 1.27.x) via
# `nginx -c /etc/nginx/bench/h2.conf`.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream backends {
        # No algorithm directive → round-robin, matching the LB's `round_robin`.
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
        server backend4:8080;

        # Matches the LB's transport.max_idle_conns_per_host (spec §24). The
        # matched parameter is the configured pool size; nginx scales it per
        # worker while the LB's is flat per host, a nuance the run methodology
        # records (issue 06).
        keepalive 100;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            # The h2 slice runs the backends with TLS (the LB speaks HTTP/2 to
            # them over ALPN), so nginx must also reach them over TLS. nginx
            # proxies upstream as HTTP/1.1 here: it has no upstream-HTTP/2
            # directive for this topology, so the backend leg is TLS+h1 for
            # nginx and TLS+h2 for the LB. The client-facing comparison — the
            # protocol slice's subject — stays matched.
            proxy_pass https://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Self-signed shared SAN cert; verification is deliberately off for
            # the benchmark, mirroring the LB config's transport.tls_skip_verify.
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }
    }
}
