# Nginx comparison config: TLS + HTTP/2 with least-connections (S5.T4-harness).
#
# Same as h2.conf but with `least_conn;` in the upstream, so the LB's
# `least_conn` algorithm is compared against Nginx's `least_conn` — a
# constrained match, not "Nginx at its best" (spec §24–§25). h2.conf stays the
# round-robin match; `bench/run.sh` selects this file for the leastconn core
# runs.
#
# `http2 on;` is the nginx 1.25.1+ syntax; the certificate is the shared SAN
# cert from scripts/generate-cert.sh, mounted at /certs, and the backends are
# reached over TLS (the h2 slice runs them with TLS).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream backends {
        least_conn;
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
        server backend4:8080;

        # Matches the LB's transport.max_idle_conns_per_host (spec §24).
        keepalive 100;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            proxy_pass https://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }
    }
}
