# Nginx comparison config: plain HTTP/1.1 (S5.T4-infra).
#
# Every parameter here is mirrored by the LB config it is compared against, so
# the match is constrained — same algorithm (round-robin), same four backends,
# same keepalive pool — never "Nginx at its best" (spec §24). A throughput gap
# is then attributable to implementation, not tuning.
#
# Run by the `nginx` service in bench/docker-compose.yml, pinned to nginx
# 1.27.x. This file is a complete main config passed with `nginx -c`.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream backends {
        # No algorithm directive → round-robin, matching the LB's `round_robin`.
        server backend1:8080;
        server backend2:8080;
        server backend3:8080;
        server backend4:8080;

        # Matches the LB's transport.max_idle_conns_per_host (spec §24). The
        # matched parameter is the configured pool size; nginx scales it per
        # worker while the LB's is flat per host, a nuance the run methodology
        # records (issue 06).
        keepalive 100;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backends;
            # Reuse upstream keepalives; without 1.1 + an empty Connection
            # header nginx would open a new backend connection per request and
            # the comparison would be measuring connection setup.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
