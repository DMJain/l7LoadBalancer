# Benchmark config (S5.T4-harness): plain-HTTP client, least-connections LB,
# four plain-HTTP backends. Self-contained by design (spec §31) — no
# templating, no sed, readable in isolation. Matched head-to-head by
# bench/nginx/http11.conf (nginx `least_conn`).
listen: ":8080"
algorithm: "least_conn"
metrics:
  listen: ":9090"
health_endpoint:
  listen: ":8081"
transport:
  max_idle_conns_per_host: 100
backends:
  - name: "backend1"
    url: "http://backend1:8080"
  - name: "backend2"
    url: "http://backend2:8080"
  - name: "backend3"
    url: "http://backend3:8080"
  - name: "backend4"
    url: "http://backend4:8080"
