# Benchmark config (S5.T4-harness): plain-HTTP client, least-connections LB, four plain-HTTP backends. See bench/README.md.
listen: ":8080"
algorithm: "least_conn"
metrics:
  listen: ":9090"
health_endpoint:
  listen: ":8081"
transport:
  max_idle_conns_per_host: 100
backends:
  - name: "backend1"
    url: "http://backend1:8080"
  - name: "backend2"
    url: "http://backend2:8080"
  - name: "backend3"
    url: "http://backend3:8080"
  - name: "backend4"
    url: "http://backend4:8080"
