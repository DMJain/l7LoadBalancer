# Benchmark config (S5.T4-harness): TLS+ALPN HTTP/2, P2C-EWMA LB, https:// backends. See bench/README.md.
listen: ":8080"
tls:
  cert_file: "/certs/server.crt"
  key_file: "/certs/server.key"
algorithm: "p2c_ewma"
metrics:
  listen: ":9090"
health_endpoint:
  listen: ":8081"
transport:
  force_http2: true
  tls_skip_verify: true
  max_idle_conns_per_host: 100
backends:
  - name: "backend1"
    url: "https://backend1:8080"
  - name: "backend2"
    url: "https://backend2:8080"
  - name: "backend3"
    url: "https://backend3:8080"
  - name: "backend4"
    url: "https://backend4:8080"
