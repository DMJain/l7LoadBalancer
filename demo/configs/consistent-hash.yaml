# Demo LB — consistent-hash-bounded (S5.T16.3.2, ADR-0023 decision 4).
#
# Identical to roundrobin.yaml except for `algorithm`. The hash key is the
# client IP (internal/balancer/hashkey.go), so each of the eight generator
# containers is one key; with Zipf-skewed clients the hottest key's owner is the
# one that spills (ADR-0023 decision 6). See roundrobin.yaml for the shared
# rationale.

listen: ":8080"

algorithm: "consistent_hash"

metrics:
  listen: ":9090"

health_endpoint:
  listen: ":8081"

backends:
  - name: "backend1"
    url: "http://backend1:8080"
  - name: "backend2"
    url: "http://backend2:8080"
  - name: "backend3"
    url: "http://backend3:8080"
  - name: "backend4"
    url: "http://backend4:8080"
