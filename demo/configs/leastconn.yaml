# Demo LB — least-connections (S5.T16.3.2, ADR-0023 decision 4).
#
# Identical to roundrobin.yaml except for `algorithm`. See that file for the
# shared rationale.

listen: ":8080"

algorithm: "least_conn"

metrics:
  listen: ":9090"

health_endpoint:
  listen: ":8081"

backends:
  - name: "backend1"
    url: "http://backend1:8080"
  - name: "backend2"
    url: "http://backend2:8080"
  - name: "backend3"
    url: "http://backend3:8080"
  - name: "backend4"
    url: "http://backend4:8080"
